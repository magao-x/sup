[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sup"
dynamic = ["version"]
description = "The MagAO-X web user interface"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joseph D. Long", email = "github@joseph-long.com" }]
dependencies = [
    "starlette>=0.19.0",
    "uvicorn",
    "orjson>=3.6.7",
    "astroplan>=0.8",
    "uvloop>=0.16",
    "purepyindi2",
    "xconf",
    "toml>=0.10.2",
    "websockets>=10.2",
    "blosc>=1.11.1",
    "watchdog>=6.0.0",
    "psutil>=5.9.8,<6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",  # for starlette's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sup = "sup.core:WebInterface.run"

[project.urls]
"Bug Reports" = "https://github.com/magao-x/sup/issues"

# --- build configuration -------------------------------------------------

# sup/static/ is gitignored (it is generated by the frontend build), so it
# must be listed here or hatchling will leave it out of the distributions.
[tool.hatch.build]
artifacts = ["sup/static/**"]

[tool.hatch.version]
path = "sup/VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["sup"]

[tool.hatch.build.targets.sdist]
# The viewarr submodule is deliberately absent: the workspace reaches its
# library through symlinks, which the build machinery resolves to a single
# real directory and records only under a symlinked path, so what landed in
# the sdist depended on walk order. Instead the sdist ships the built
# sup/static/ (see artifacts above) and the build hook reuses it, which is
# all a wheel actually needs.
include = ["sup", "frontend", "README.md", "LICENSE", "hatch_build.py"]
# The readme/license patterns above match at any depth, which otherwise
# drags a handful of stray files out of the submodule.
exclude = ["**/node_modules", "viewarr-workspace"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# purepyindi2 is not published to PyPI; pull it from source.
[tool.uv.sources]
purepyindi2 = { git = "https://github.com/xwcl/purepyindi2.git" }
