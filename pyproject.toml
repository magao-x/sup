[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sup"
dynamic = ["version"]
description = "The MagAO-X web user interface"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joseph D. Long", email = "github@joseph-long.com" }]
dependencies = [
    "starlette>=0.19.0",
    "uvicorn",
    "orjson>=3.6.7",
    "astroplan>=0.8",
    "uvloop>=0.16",
    "purepyindi2",
    "xconf",
    "toml>=0.10.2",
    "websockets>=10.2",
    "blosc>=1.11.1",
    "watchdog>=6.0.0",
    "psutil>=5.9.8,<6",
]

[project.scripts]
sup = "sup.core:WebInterface.run"

[project.urls]
"Bug Reports" = "https://github.com/magao-x/sup/issues"

# --- build configuration -------------------------------------------------

# sup/static/ is gitignored (it is generated by the frontend build), so it
# must be listed here or hatchling will leave it out of the distributions.
[tool.hatch.build]
artifacts = ["sup/static/**"]

[tool.hatch.version]
path = "sup/VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["sup"]

[tool.hatch.build.targets.sdist]
# Ship the frontend sources so a wheel can be built from the sdist.
include = ["sup", "frontend", "viewarr", "README.md", "LICENSE", "hatch_build.py"]
# Nested build dirs: hatchling only honours the top-level .gitignore.
exclude = ["viewarr/target", "viewarr/pkg", "**/node_modules"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# purepyindi2 is not published to PyPI; pull it from source.
[tool.uv.sources]
purepyindi2 = { git = "https://github.com/xwcl/purepyindi2.git" }
