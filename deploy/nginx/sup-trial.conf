# Serves the trial web UI on its own HTTPS port, beside the production UI on
# 443: image streams (/ws/viewcam/) go to sup-stream, everything else to the
# trial sup. See DEPLOY.md.
#
# Install: copy into /etc/nginx/conf.d/ (or sites-available/, linked from
# sites-enabled/), point ssl_certificate* at the certificate the production
# server block already uses, then `sudo nginx -t && sudo systemctl reload nginx`.

# WebSocket upgrades: pass "upgrade" on when the client asked for one, and
# "close" otherwise. /ws/viewcam/ carries both: the stream list is plain HTTP
# and the feeds are WebSockets. Drop this map if your config already has it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sup_trial {
    server 127.0.0.1:9291;
}

upstream sup_stream {
    server 127.0.0.1:9192;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # The same certificate as the production server block.
    ssl_certificate     /etc/ssl/certs/magaox.crt;
    ssl_certificate_key /etc/ssl/private/magaox.key;

    # Settings every proxied location here shares.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx closes a proxied connection after 60 s without traffic. A feed
    # can be quiet far longer (a dark is sent once; a hidden tab pauses its
    # feeds), so allow a day.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    # Image streams: one WebSocket per shmim, and the list of streams.
    # Frames are already compressed and paced by the client's window, so
    # nginx shouldn't buffer them.
    location /ws/viewcam/ {
        proxy_pass http://sup_stream;
        proxy_buffering off;
    }

    # Everything else: the UI, its INDI and log WebSockets, and its HTTP routes.
    location / {
        proxy_pass http://sup_trial;
    }
}
